
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Gauri</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">Gauri<span>.</span></a>
        <button class="menu-toggle" id="menuToggle">☰</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
<section class="page-banner">
    <p>LET'S CONNECT</p>
    <h1>Contact <span>Me</span></h1>
</section>

<section class="contact-container section">

    <div class="contact-info">
        <h2>Get In Touch</h2>
        <p>Have a project or opportunity? Feel free to contact me.</p>

        <div class="contact-item">
            <h3>Email</h3>
            <p>your-email@example.com</p>
        </div>

        <div class="contact-item">
            <h3>GitHub</h3>
            <a href="https://github.com/" target="_blank" rel="noopener">Visit GitHub</a>
        </div>

        <div class="contact-item">
            <h3>LinkedIn</h3>
            <a href="https://linkedin.com/" target="_blank" rel="noopener">Visit LinkedIn</a>
        </div>
    </div>

    <form class="contact-form" id="contactForm">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Your Email" required>
        <input type="text" id="subject" placeholder="Subject" required>
        <textarea id="message" placeholder="Your Message" rows="5" required></textarea>

        <button type="submit" class="btn">Send Message</button>
        <p id="formStatus" aria-live="polite"></p>
    </form>

</section>
</main>

<footer>
    <p>© 2026 Gauri Mahadkar. All Rights Reserved.</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
